<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
.lbl{font-size:11px;font-weight:700;color:#475569;letter-spacing:.08em;text-transform:uppercase}
.inp{height:46px;box-sizing:border-box;width:100%;padding:0 14px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 28px; background: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 16px">
  <img src="/_blob/675c5e79e89591485bc5a1234cb13379" alt="Sila" style="width: 88px; height: 88px; object-fit: contain; align-self: center; margin-top: 48px">
  <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">Welcome to Sila</h1>
    <p style="margin: 0; font-size: 14px; color: #475569">Chats, groups and tickets in one place</p>
  </div>
  <form onSubmit="{{signIn}}" style="display: flex; flex-direction: column; gap: 14px; margin-top: 12px">
    <label style="display: flex; flex-direction: column; gap: 7px">
      <span class="lbl">User name</span>
      <input class="inp" value="m.alkholy" autocomplete="username">
    </label>
    <label style="display: flex; flex-direction: column; gap: 7px">
      <span class="lbl">Password</span>
      <span style="position: relative; display: block">
        <input class="inp" type="password" value="password1" autocomplete="current-password" style="padding-right: 52px">
        <button type="button" aria-label="Show password" style="position: absolute; right: 2px; top: 1px; width: 44px; height: 44px; border: none; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </span>
    </label>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px">
      <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #c2410c">
      Keep me signed in
    </label>
    <sc-if value="{{error}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="padding: 10px 14px; border-radius: 7px; background: #fef2f2; color: #b91c1c; font-size: 13px; border: 1px solid #fecaca">Wrong user name or password.</div>
    </sc-if>
    <button type="submit" style="height: 50px; border: none; border-radius: 10px; background: #c2410c; color: #ffffff; font-size: 16px; font-weight: 700">Sign in</button>
  </form>
  <div style="flex: 1"></div>
  <div style="text-align: center; font-size: 12px; color: #64748b">Version 280 · GLC Paints</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { error: false }; }
  renderVals() {
    return { error: this.state.error, signIn: (e) => { e.preventDefault(); this.setState({ error: !this.state.error }); } };
  }
}
</script>
</body>
</html>
