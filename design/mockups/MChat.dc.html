<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
.ib{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:#0f172a;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
.in{align-self:flex-start;max-width:78%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#ffffff;border:1px solid #e2e8f0;font-size:14px;text-align:left;color:#0f172a;cursor:pointer}
.out{align-self:flex-end;max-width:78%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:#fff7ed;border:1px solid #fed7aa;font-size:14px;text-align:left;color:#0f172a;cursor:pointer}
.meta{display:block;text-align:right;font-size:11px;color:#64748b;margin-top:2px}
.act{flex:1;min-height:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:#0f172a;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #f1f5f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px 6px 8px; display: flex; align-items: center; gap: 4px; background: #ffffff; border-bottom: 1px solid #e2e8f0">
    <a href="MHome.dc.html" class="ib" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
    </a>
    <a href="MProfile.dc.html" aria-label="Mona Hassan, open profile" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; min-height: 44px">
      <span style="position: relative; width: 40px; height: 40px; border-radius: 20px; background: #7c3aed; color: #ffffff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">MH<span style="position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 6px; background: #16a34a; border: 2px solid #ffffff"></span></span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">Mona Hassan</span>
        <span style="font-size: 12px; color: #15803d; font-weight: 600">Online</span>
      </span>
    </a>
    <button class="ib" aria-label="Search in chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    <button class="ib" aria-label="Media, links and files"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="12" cy="19" r="1.2"></circle></svg></button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px">
    <span style="align-self: center; padding: 2px 10px; border-radius: 999px; background: #e2e8f0; color: #475569; font-size: 12px; font-weight: 700">Today</span>
    <button class="in" onClick="{{pick}}">Good morning, did Delta send the new quotation?<span class="meta">09:02</span></button>
    <button class="out" onClick="{{pick}}">Yes, it came by mail. I'll forward it to the Purchasing channel.<span class="meta">09:05 ✓✓</span></button>
    <button class="in" onClick="{{pick}}">
      <span style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: #f8fafc; margin-bottom: 4px">
        <span style="width: 32px; height: 38px; border-radius: 5px; background: #dc2626; color: #ffffff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">PDF</span>
        <span style="display: flex; flex-direction: column"><b style="font-size: 13px">Q-2291 Quotation.pdf</b><span style="font-size: 12px; color: #64748b">240 KB · tap to open</span></span>
      </span>
      Here is the file anyway<span class="meta">09:20</span>
    </button>
    <button class="out" onClick="{{pick}}">
      <span style="display: flex; align-items: center; gap: 10px; min-width: 210px">
        <span style="width: 34px; height: 34px; border-radius: 17px; background: #c2410c; color: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
        </span>
        <span style="flex: 1; height: 22px; display: flex; align-items: center; gap: 2px" aria-hidden="true">
          <span style="width: 3px; height: 8px; background: #9a3412; border-radius: 2px"></span><span style="width: 3px; height: 16px; background: #9a3412; border-radius: 2px"></span><span style="width: 3px; height: 12px; background: #9a3412; border-radius: 2px"></span><span style="width: 3px; height: 20px; background: #9a3412; border-radius: 2px"></span><span style="width: 3px; height: 10px; background: #fdba74; border-radius: 2px"></span><span style="width: 3px; height: 14px; background: #fdba74; border-radius: 2px"></span><span style="width: 3px; height: 6px; background: #fdba74; border-radius: 2px"></span><span style="width: 3px; height: 18px; background: #fdba74; border-radius: 2px"></span><span style="width: 3px; height: 9px; background: #fdba74; border-radius: 2px"></span><span style="width: 3px; height: 13px; background: #fdba74; border-radius: 2px"></span>
        </span>
        <span style="font-size: 12px; color: #475569">0:24</span>
      </span>
      <span class="meta">09:31 ✓✓</span>
    </button>
    <button class="in" onClick="{{pick}}">
      <span style="display: block; padding: 6px 10px; border-radius: 8px; background: #f8fafc; border-left: 3px solid #c2410c; margin-bottom: 6px; font-size: 12px; color: #475569"><b style="color: #9a3412">You</b><br>I'll forward it to the Purchasing channel.</span>
      Great, please ask for 2 weeks delivery.<span class="meta">11:58</span>
    </button>
    <span style="align-self: center; font-size: 12px; color: #64748b">Tap the quote to jump to the original message</span>
  </div>

  <div style="padding: 8px 8px 24px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; align-items: flex-end; gap: 6px">
    <button class="ib" aria-label="Attach: photo, camera, file"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <label style="flex: 1; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 22px; background: #f1f5f9">
      <input aria-label="Message" placeholder="Message" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #0f172a">
    </label>
    <button class="ib" aria-label="Hold to record a voice note" style="background: #c2410c; color: #ffffff; border-radius: 22px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(15,23,42,.4); display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{close}}" style="flex: 1; border: none; background: transparent; cursor: pointer"></button>
      <div role="dialog" aria-label="Message options" style="background: #ffffff; border-radius: 18px 18px 0 0; padding: 8px 12px 28px; display: flex; flex-direction: column; gap: 6px">
        <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #cbd5e1; margin-bottom: 6px"></span>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr)">
          <button class="act" onClick="{{close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 5 5v6"></path></svg>Reply</button>
          <button class="act" onClick="{{close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0-5 5v6"></path></svg>Forward</button>
          <a href="MReminder.dc.html" class="act" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>Remind me</a>
          <button class="act" onClick="{{close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h9"></path></svg>Copy</button>
          <button class="act" onClick="{{close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21V4h11l-1 4h6v9h-8l1-4H4"></path></svg>Flag</button>
          <button class="act" onClick="{{close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit</button>
          <button class="act" onClick="{{close}}" style="color: #b91c1c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sheet: false }; }
  renderVals() {
    return { sheet: this.state.sheet, pick: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }) };
  }
}
</script>
</body>
</html>
