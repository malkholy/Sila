<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila — Mail to ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 600px; height: 680px; box-sizing: border-box; padding: 24px; background: rgba(15,23,42,.4); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.5">
  <form role="dialog" aria-modal="true" aria-labelledby="mt-title" onSubmit="{{create}}" style="width: 100%; box-sizing: border-box; padding: 20px; border-radius: 16px; background: #ffffff; box-shadow: 0 20px 50px rgba(15,23,42,.25); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 34px; height: 34px; border-radius: 10px; background: #fff7ed; color: #c2410c; display: flex; align-items: center; justify-content: center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg>
      </span>
      <h2 id="mt-title" style="flex: 1; margin: 0; font-size: 17px; font-weight: 800">Create a ticket from this mail</h2>
      <a href="Mail.dc.html" aria-label="Close" style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #e2e8f0; color: #475569; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>
    <div style="padding: 8px 12px; border-radius: 10px; background: #f8fafc; border-left: 3px solid #c2410c; font-size: 12px; color: #475569">
      From <b>Delta Packaging</b> · Sat 24 Oct, 11:42 · Quotation Q-2291 for 5,000 drums
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">Channel</span>
      <div role="radiogroup" aria-label="Channel" style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{channels}}" as="c" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; text-align: left; cursor: pointer">
            <span style="font-weight: 700; color: #0f172a"># {{c.name}}</span>
            <span style="flex: 1; font-size: 12px; color: #64748b">{{c.purpose}}</span>
            <sc-if value="{{c.suggested}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; color: #15803d">Suggested</span></sc-if>
          </button>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">Subject</span>
      <input value="Quotation Q-2291 — 5,000 drums, Delta Packaging" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">First message (the mail's text, edit as you like)</span>
      <textarea rows="4" style="padding: 8px 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a; resize: vertical">Please review Delta Packaging's quotation Q-2291 for 5,000 drums (20 L, blue). Prices valid until 15 November, delivery 3 weeks from the PO.</textarea>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0">
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
        <input type="checkbox" checked style="width: 17px; height: 17px; accent-color: #c2410c">
        Attach the mail's 2 files (Q-2291 Quotation.pdf, Drum spec sheet.xlsx)
      </label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
        <input type="checkbox" checked style="width: 17px; height: 17px; accent-color: #c2410c">
        Link the ticket to the mail (shown on both)
      </label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
        <input type="checkbox" style="width: 17px; height: 17px; accent-color: #c2410c">
        Reply to the sender with the ticket number
      </label>
    </div>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div role="status" style="font-size: 13px; font-weight: 700; color: #15803d">Ticket #2301901 created in # {{chosen}}.</div>
    </sc-if>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <a href="Mail.dc.html" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #e2e8f0; color: #0f172a; font-weight: 700; font-size: 13px; display: flex; align-items: center; text-decoration: none">Cancel</a>
      <button type="submit" style="height: 40px; padding: 0 18px; border-radius: 10px; border: none; background: #c2410c; color: #ffffff; font-weight: 700; font-size: 13px; cursor: pointer">Create ticket</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":680}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ch: 'Purchasing', done: false }; }
  renderVals() {
    const C = [['Purchasing', 'Quotations, POs, vendor codes', true], ['Logistics', 'Freight, shipments, customs', false], ['Finance', 'Payments, invoices', false]];
    return {
      channels: C.map(([name, purpose, suggested]) => {
        const on = name === this.state.ch;
        return { name, purpose, suggested, checked: on ? 'true' : 'false', border: on ? '#c2410c' : '#e2e8f0', bg: on ? '#fff7ed' : '#ffffff',
          pick: () => this.setState({ ch: name, done: false }) };
      }),
      chosen: this.state.ch, done: this.state.done,
      create: (e) => { e.preventDefault(); this.setState({ done: true }); }
    };
  }
}
</script>
</body>
</html>
