<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media, links and docs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<section aria-label="Media, links and docs" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #0f172a">

  <!-- Summary (as in a WhatsApp contact panel) -->
  <sc-if value="{{isSummary}}" hint-placeholder-val="{{true}}">
    <button onClick="{{openAll}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 4px; border: none; background: transparent; cursor: pointer; color: #0f172a; text-align: left">
      <span style="font-size: 13px; font-weight: 700">Media, links and docs</span>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #475569">{{total}}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </span>
    </button>
    <sc-if value="{{hasPreview}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{preview}}" as="t" hint-placeholder-count="4">
          <button onClick="{{openMedia}}" aria-label="{{t.label}}" style="position: relative; aspect-ratio: 1 / 1; padding: 0; border: none; border-radius: 8px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{t.isPhoto}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg></sc-if>
            <sc-if value="{{t.isVideo}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
              <span style="position: absolute; right: 4px; bottom: 4px; padding: 0 4px; border-radius: 4px; background: rgba(15,23,42,.75); color: #ffffff; font-size: 10px; font-weight: 700">{{t.dur}}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noMedia}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; padding: 0 4px; font-size: 13px; color: #64748b">No media, links or docs yet.</p>
    </sc-if>
  </sc-if>

  <!-- Full browser -->
  <sc-if value="{{isAll}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; gap: 8px">
      <button onClick="{{back}}" aria-label="Back" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; color: #475569; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </button>
      <h3 style="margin: 0; font-size: 14px; font-weight: 800">Media, links and docs</h3>
    </div>
    <div role="tablist" aria-label="Attachment type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #e2e8f0">
      <sc-for list="{{tabs}}" as="b" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{b.selected}}" onClick="{{b.pick}}" style="height: 40px; border: none; border-bottom: 3px solid {{b.line}}; background: transparent; color: {{b.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{b.label}} · {{b.count}}</button>
      </sc-for>
    </div>

    <sc-if value="{{tabEmpty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 8px 4px; font-size: 13px; color: #64748b">Nothing here yet.</p>
    </sc-if>

    <sc-if value="{{onMedia}}" hint-placeholder-val="{{true}}">
      <sc-for list="{{mediaMonths}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h4 style="margin: 4px 4px 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #475569">{{g.month}}</h4>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{g.items}}" as="t" hint-placeholder-count="6">
              <button aria-label="{{t.label}}" style="position: relative; aspect-ratio: 1 / 1; padding: 0; border: none; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <sc-if value="{{t.isPhoto}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m21 16-5-5-8 8"></path></svg></sc-if>
                <sc-if value="{{t.isVideo}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
                  <span style="position: absolute; right: 4px; bottom: 4px; padding: 0 4px; border-radius: 4px; background: rgba(15,23,42,.75); color: #ffffff; font-size: 10px; font-weight: 700">{{t.dur}}</span>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{onDocs}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{docMonths}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h4 style="margin: 4px 4px 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #475569">{{g.month}}</h4>
          <sc-for list="{{g.items}}" as="d" hint-placeholder-count="2">
            <button style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; text-align: left; cursor: pointer; color: #0f172a">
              <span style="flex: 0 0 36px; width: 36px; height: 40px; border-radius: 6px; background: {{d.color}}; color: #ffffff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{d.ext}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</span>
                <span style="font-size: 12px; color: #64748b">{{d.size}} · {{d.from}} · {{d.date}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{onLinks}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{linkMonths}}" as="g" hint-placeholder-count="1">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h4 style="margin: 4px 4px 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #475569">{{g.month}}</h4>
          <sc-for list="{{g.items}}" as="l" hint-placeholder-count="2">
            <a href="{{l.url}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; text-decoration: none; color: #0f172a">
              <span style="flex: 0 0 36px; width: 36px; height: 36px; border-radius: 8px; background: #f1f5f9; color: #334155; font-weight: 800; display: flex; align-items: center; justify-content: center">{{l.initial}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.title}}</span>
                <span style="font-size: 12px; color: #1d4ed8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.domain}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </sc-if>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"set":{"editor":"enum","options":["d-mona","g-sales","t2507460","empty"],"default":"d-mona"},"$preview":{"width":320,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'summary', tab: 'media', forSet: props.set };
  }
  componentDidUpdate() {
    // a different conversation was opened: back to the summary
    if (this.props.set !== this.state.forSet) this.setState({ view: 'summary', tab: 'media', forSet: this.props.set });
  }
  library(set) {
    // Sample attachments. Real data: AttachmentHistory rows for the chat / group (GroupID) / ticket (TicketID),
    // split by FileExtension into media (jpg, png, mp4 ...) and docs; links are parsed out of message text.
    const tones = [['#fde68a', '#92400e'], ['#bfdbfe', '#1e40af'], ['#bbf7d0', '#166534'], ['#fecaca', '#991b1b'], ['#ddd6fe', '#5b21b6'], ['#fed7aa', '#9a3412'], ['#e2e8f0', '#334155']];
    const media = (n, months) => Array.from({ length: n }, (_, i) => {
      const video = i % 4 === 2;
      const [bg, fg] = tones[i % tones.length];
      const month = months[Math.min(months.length - 1, Math.floor(i / 6))];
      return { isPhoto: !video, isVideo: video, dur: video ? '0:' + String(12 + i * 3).padStart(2, '0') : '', bg, fg, month,
        label: (video ? 'Video' : 'Photo') + ', ' + month };
    });
    const doc = (name, ext, size, from, date, month) => ({ name, ext, size, from, date, month,
      color: ext === 'PDF' ? '#b91c1c' : ext === 'XLSX' ? '#15803d' : ext === 'DOCX' ? '#1d4ed8' : '#475569' });
    const link = (title, domain, month) => ({ title, domain, url: 'https://' + domain, month, initial: domain[0].toUpperCase() });
    const sets = {
      'd-mona': {
        media: media(9, ['This month', 'September']),
        docs: [doc('Price list — October.xlsx', 'XLSX', '84 KB', 'Mona Adel', 'Today', 'This month'),
               doc('Customer visit plan.docx', 'DOCX', '36 KB', 'You', 'Oct 6', 'This month'),
               doc('Promotion terms.pdf', 'PDF', '410 KB', 'Mona Adel', 'Sep 22', 'September')],
        links: [link('October promotion — landing page', 'example.com/promo', 'This month')]
      },
      'g-sales': {
        media: media(14, ['This month', 'September', 'August']),
        docs: [doc('Weekly targets.xlsx', 'XLSX', '52 KB', 'Mona Adel', 'Sun', 'This month'),
               doc('Meeting notes.pdf', 'PDF', '128 KB', 'Yasmin Fathy', 'Yesterday', 'This month'),
               doc('Route plan — Delta.xlsx', 'XLSX', '61 KB', 'Karim Hassan', 'Sep 14', 'September'),
               doc('Q3 review.pdf', 'PDF', '1.2 MB', 'Mona Adel', 'Aug 30', 'August')],
        links: [link('Shared visit sheet', 'example.com/visits', 'This month'), link('Competitor price survey', 'example.com/survey', 'September')]
      },
      't2507460': {
        media: media(2, ['This month']),
        docs: [doc('Invoice 4471.pdf', 'PDF', '212 KB', 'Mona Adel', 'Today', 'This month'),
               doc('Payment voucher.pdf', 'PDF', '96 KB', 'Omar Nabil', 'Today', 'This month')],
        links: []
      },
      empty: { media: [], docs: [], links: [] }
    };
    return sets[set] || { media: media(3, ['This month']), docs: [doc('Attachment.pdf', 'PDF', '88 KB', 'Omar Nabil', 'Oct 12', 'This month')], links: [] };
  }
  renderVals() {
    const lib = this.library(this.props.set || 'd-mona');
    const st = this.state;
    const byMonth = (list) => {
      const months = [...new Set(list.map(x => x.month))];
      return months.map(month => ({ month, items: list.filter(x => x.month === month) }));
    };
    const TABS = [['media', 'Media', lib.media.length], ['docs', 'Docs', lib.docs.length], ['links', 'Links', lib.links.length]];
    const tabs = TABS.map(([id, label, count]) => {
      const on = st.tab === id;
      return { label, count, selected: on ? 'true' : 'false', line: on ? '#c2410c' : 'transparent', fg: on ? '#9a3412' : '#475569',
        pick: () => this.setState({ tab: id }) };
    });
    const total = lib.media.length + lib.docs.length + lib.links.length;
    const cur = TABS.find(t => t[0] === st.tab);
    return {
      isSummary: st.view === 'summary', isAll: st.view === 'all',
      total, preview: lib.media.slice(0, 4), hasPreview: lib.media.length > 0, noMedia: total === 0,
      openAll: () => this.setState({ view: 'all', tab: lib.media.length ? 'media' : lib.docs.length ? 'docs' : 'links' }),
      openMedia: () => this.setState({ view: 'all', tab: 'media' }),
      back: () => this.setState({ view: 'summary' }),
      tabs, onMedia: st.tab === 'media', onDocs: st.tab === 'docs', onLinks: st.tab === 'links', tabEmpty: cur[2] === 0,
      mediaMonths: byMonth(lib.media), docMonths: byMonth(lib.docs), linkMonths: byMonth(lib.links)
    };
  }
}
</script>
</body>
</html>
