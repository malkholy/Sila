<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — Mail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
.tb{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:4px 4px 20px}
.tb a{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#64748b;text-decoration:none}
.tb a.on{color:#c2410c;font-weight:800}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px 16px 6px; display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 4px">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Folder</span>
        <select style="border: none; background: transparent; font-size: 22px; font-weight: 800; color: #0f172a; padding: 0; min-height: 36px">
          <option>Inbox</option><option>Sent</option><option>Drafts</option><option>Archive</option><option>Deleted</option>
        </select>
      </label>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #15803d; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16a34a"></span>Synced 10 s ago</span>
    </span>
    <button aria-label="Search mail" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #f1f5f9; color: #0f172a; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
  </header>
  <div role="tablist" aria-label="Show" style="display: flex; gap: 6px; padding: 4px 16px 10px; border-bottom: 1px solid #f1f5f9">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="flex: 1; overflow: hidden">
    <sc-for list="{{mails}}" as="m" hint-placeholder-count="6">
      <a href="MMailRead.dc.html" style="display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; text-decoration: none; color: #0f172a">
        <span style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{m.color}}; color: #ffffff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{m.initials}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="display: flex; align-items: center; gap: 6px">
            <sc-if value="{{m.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Unread" style="width: 8px; height: 8px; border-radius: 4px; background: #c2410c; flex-shrink: 0"></span></sc-if>
            <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: {{m.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.from}}</span>
            <span style="font-size: 12px; color: #64748b">{{m.time}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 6px">
            <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: {{m.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.subject}}</span>
            <sc-if value="{{m.files}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-label="Has attachments"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg></sc-if>
            <sc-if value="{{m.flag}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="#dc2626" stroke="#dc2626" stroke-width="2" stroke-linecap="round" aria-label="Flagged"><path d="M4 21V4h11l-1 4h6v9h-8l1-4H4"></path></svg></sc-if>
          </span>
          <span style="font-size: 13px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.preview}}</span>
          <sc-if value="{{m.ticket}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; margin-top: 2px; padding: 0 8px; border-radius: 999px; background: #fff7ed; color: #9a3412; font-size: 11px; font-weight: 700">Ticket {{m.ticket}}</span></sc-if>
        </span>
      </a>
    </sc-for>
  </div>
  <a href="MMailRead.dc.html" aria-label="New mail" style="position: absolute; right: 16px; bottom: 96px; height: 52px; padding: 0 18px; border-radius: 26px; background: #c2410c; color: #ffffff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 20px rgba(194,65,12,.35)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>New mail
  </a>
  <nav class="tb" aria-label="Main">
    <a href="MHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="MChannels.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg>Channels</a>
    <a href="MMyDay.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>My Day</a>
    <a href="MMail.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg>Mail</a>
    <a href="MMe.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'All' }; }
  renderVals() {
    const M = [
      { from: 'Delta Packaging', initials: 'DP', color: '#2563eb', subject: 'Quotation Q-2291 for 5,000 drums', preview: 'Please find attached our quotation, valid until 15 November…', time: '11:42', unread: true, files: true, flag: true },
      { from: 'Mona Hassan', initials: 'MH', color: '#7c3aed', subject: 'RE: PO 7731 price difference', preview: 'The difference is the freight. I opened a ticket.', time: '10:05', unread: true, ticket: '#2301849' },
      { from: 'Hany Farouk', initials: 'HF', color: '#b45309', subject: 'Budget Q4 — purchasing', preview: 'Attached the approved budget lines for Q4.', time: '09:20', files: true },
      { from: 'Maersk Line', initials: 'ML', color: '#0f766e', subject: 'Booking confirmation 44', preview: 'Your booking is confirmed for vessel…', time: 'Yesterday' },
      { from: 'IT Helpdesk', initials: 'IT', color: '#475569', subject: 'Mail maintenance on Friday', preview: 'Mail will be unavailable for 30 minutes…', time: 'Thu' },
      { from: 'Salma Morsy', initials: 'SM', color: '#be185d', subject: 'Invoice 5520 copy', preview: 'Here is the copy you asked for.', time: 'Wed', files: true }
    ];
    const f = this.state.f;
    const list = M.filter(m => f === 'All' || (f === 'Unread' && m.unread) || (f === 'Flagged' && m.flag) || (f === 'Files' && m.files));
    return {
      chips: ['All', 'Unread', 'Flagged', 'Files'].map(l => { const on = l === f; return { label: l, sel: on ? 'true' : 'false', bg: on ? '#c2410c' : '#ffffff', fg: on ? '#ffffff' : '#0f172a', border: on ? '#c2410c' : '#e2e8f0', pick: () => this.setState({ f: l }) }; }),
      mails: list.map(m => ({ ...m, unread: !!m.unread, files: !!m.files, flag: !!m.flag, ticket: m.ticket || false, weight: m.unread ? '800' : '600' }))
    };
  }
}
</script>
</body>
</html>
