<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila — New reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea,select{font-family:inherit}
</style>
</helmet>
<div style="width: 560px; height: 760px; box-sizing: border-box; padding: 24px; background: rgba(15,23,42,.4); display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.5">
  <form role="dialog" aria-modal="true" aria-labelledby="rem-title" onSubmit="{{save}}" style="width: 100%; box-sizing: border-box; padding: 22px; border-radius: 16px; background: #ffffff; box-shadow: 0 20px 50px rgba(15,23,42,.25); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #fff7ed; color: #c2410c; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
      </span>
      <h2 id="rem-title" style="flex: 1; margin: 0; font-size: 17px; font-weight: 800">New reminder</h2>
      <a href="MyDay.dc.html" aria-label="Close" style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #e2e8f0; color: #475569; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">What to remember</span>
      <input value="Follow up on the vendor code" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; color: #0f172a">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">Note (optional)</span>
      <textarea rows="3" style="padding: 8px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; color: #0f172a; resize: vertical">Ask Finance for the bank letter, then update the ticket.</textarea>
    </label>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">When</span>
      <div role="group" aria-label="Quick times" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <button type="button" onClick="{{q.pick}}" aria-pressed="{{q.pressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{q.border}}; background: {{q.bg}}; color: {{q.fg}}; font-size: 12px; font-weight: 700; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: #64748b">Date</span>
          <input type="date" value="{{date}}" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a">
        </label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: #64748b">Time (optional)</span>
          <input type="time" value="{{time}}" style="height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a">
        </label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: #64748b">Repeat</span>
          <select style="height: 38px; padding: 0 8px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a; background: #ffffff">
            <option>Never</option><option>Every day</option><option>Every week</option><option>Every month</option>
          </select>
        </label>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 700; color: #475569">Linked to</span>
      <sc-if value="{{linked}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #fff7ed; border: 1px solid #fed7aa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg>
          <span style="flex: 1; min-width: 0; font-size: 13px"><b>Vendor code for the new supplier</b> · # Purchasing · #2301855</span>
          <button type="button" onClick="{{unlink}}" aria-label="Remove the link" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: #9a3412; cursor: pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
      </sc-if>
      <sc-if value="{{notLinked}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{relink}}" style="align-self: flex-start; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px dashed #cbd5e1; background: #ffffff; color: #475569; font-size: 12px; font-weight: 700; cursor: pointer">Personal note · link a ticket, chat or group</button>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0">
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #c2410c">
        Push to my phone at the due time
      </label>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
        <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #c2410c">
        Show a pop-up in the web app
      </label>
    </div>

    <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
      <div role="status" style="font-size: 13px; font-weight: 700; color: #15803d">Saved: reminder set for {{whenText}}.</div>
    </sc-if>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="font-size: 12px; color: #64748b">Only you see your reminders.</span>
      <span style="display: flex; gap: 8px">
        <a href="MyDay.dc.html" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #e2e8f0; color: #0f172a; font-weight: 700; font-size: 13px; display: flex; align-items: center; text-decoration: none">Cancel</a>
        <button type="submit" style="height: 40px; padding: 0 18px; border-radius: 10px; border: none; background: #c2410c; color: #ffffff; font-weight: 700; font-size: 13px; cursor: pointer">Save reminder</button>
      </span>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'tomorrow', linked: true, saved: false };
  }
  renderVals() {
    const Q = [
      ['hour', 'In 1 hour', '2026-10-24', '12:30', 'today at 12:30'],
      ['later', 'Later today 16:00', '2026-10-24', '16:00', 'today at 16:00'],
      ['tomorrow', 'Tomorrow 9:00', '2026-10-25', '09:00', 'tomorrow at 09:00'],
      ['week', 'Next week', '2026-10-31', '09:00', 'Sat 31 Oct at 09:00']
    ];
    const cur = Q.find(x => x[0] === this.state.q) || Q[2];
    return {
      quick: Q.map(([k, label]) => {
        const on = k === this.state.q;
        return { label, pressed: on ? 'true' : 'false', bg: on ? '#fff7ed' : '#ffffff', fg: on ? '#9a3412' : '#475569',
          border: on ? '#c2410c' : '#e2e8f0', pick: () => this.setState({ q: k, saved: false }) };
      }),
      date: cur[2], time: cur[3], whenText: cur[4],
      linked: this.state.linked, notLinked: !this.state.linked,
      unlink: () => this.setState({ linked: false }), relink: () => this.setState({ linked: true }),
      saved: this.state.saved,
      save: (e) => { e.preventDefault(); this.setState({ saved: true }); }
    };
  }
}
</script>
</body>
</html>
