<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — New ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
.ib{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:#0f172a;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
.lbl{font-size:12px;font-weight:700;color:#475569}
.inp{box-sizing:border-box;width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 3px;border-radius:999px;background:#f1f5f9;font-size:12px;color:#334155}
.av{width:24px;height:24px;border-radius:12px;color:#ffffff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px 8px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #f1f5f9">
    <a href="MChannels.dc.html" class="ib" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 800">New ticket</h1>
  </header>
  <form onSubmit="{{create}}" style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Channel</span>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #f1f5f9; color: #64748b">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input aria-label="Find a channel" placeholder="What do you need? e.g. laptop, vendor code" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14px; color: #0f172a">
      </label>
      <div role="radiogroup" aria-label="Channels" style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{channels}}" as="c" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border-radius: 12px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; text-align: left; cursor: pointer; color: #0f172a">
            <span style="width: 34px; height: 34px; border-radius: 10px; background: #1a2332; color: #ffffff; font-weight: 800; display: flex; align-items: center; justify-content: center">#</span>
            <span style="flex: 1; display: flex; flex-direction: column">
              <span style="font-weight: 700">{{c.name}}</span>
              <span style="font-size: 12px; color: #64748b">{{c.purpose}}</span>
            </span>
            <sc-if value="{{c.fav}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#d97706" aria-label="Favorite"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg></sc-if>
          </button>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Subject</span>
      <input class="inp" value="Laptop for new hire, Finance" style="height: 46px">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Request</span>
      <textarea class="inp" rows="3" style="resize: none">Salma starts on Sunday. Please prepare a laptop with the ERP and mail set up.</textarea>
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="display: flex; align-items: center" class="lbl">
        <span style="flex: 1">People</span>
        <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px dashed #fdba74; background: #fff7ed; color: #9a3412; font-size: 12px; font-weight: 700; cursor: pointer">+ Add people</button>
      </span>
      <span style="font-size: 12px; color: #64748b">2 admins / team leaders of # {{chosen}} join automatically.</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span class="chip"><span class="av" style="background: #475569">OF</span>Omar Fathy <b style="font-size: 10.5px; color: #9a3412">Admin</b></span>
        <span class="chip"><span class="av" style="background: #2563eb">KN</span>Khaled Nabil <b style="font-size: 10.5px; color: #9a3412">Team leader</b></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
        <span class="av" style="width: 32px; height: 32px; border-radius: 16px; background: #be185d; font-size: 11px">SM</span>
        <span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 13px">Salma Morsy</b><span style="font-size: 12px; color: #64748b">Accountant</span></span>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #475569"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #c2410c">CC</label>
      </div>
    </div>
    <div style="flex: 1"></div>
    <button type="submit" style="height: 50px; border: none; border-radius: 12px; background: #c2410c; color: #ffffff; font-size: 16px; font-weight: 700; cursor: pointer">{{submit}}</button>
  </form>
  <div style="height: 16px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ch: 'IT', done: false }; }
  renderVals() {
    const C = [['IT', 'Devices, accounts, access', true], ['Purchasing', 'Quotations, POs, vendor codes', false], ['HR', 'Hiring, leave, letters', false]];
    return {
      channels: C.map(([name, purpose, fav]) => { const on = name === this.state.ch; return { name, purpose, fav, checked: on ? 'true' : 'false', border: on ? '#c2410c' : '#e2e8f0', bg: on ? '#fff7ed' : '#ffffff', pick: () => this.setState({ ch: name, done: false }) }; }),
      chosen: this.state.ch,
      submit: this.state.done ? 'Ticket #2301861 created' : 'Create ticket',
      create: (e) => { e.preventDefault(); this.setState({ done: true }); }
    };
  }
}
</script>
</body>
</html>
