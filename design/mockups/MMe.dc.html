<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — Me</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
.tb{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:4px 4px 20px}
.tb a{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#64748b;text-decoration:none}
.tb a.on{color:#c2410c;font-weight:800}
.grp{margin:0 16px;background:#ffffff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-bottom:1px solid #f1f5f9;font-size:15px}
.ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec{margin:14px 16px 6px;font-size:11px;font-weight:800;color:#475569;letter-spacing:.06em;text-transform:uppercase}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #f1f5f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden">
    <div style="padding: 52px 16px 12px; display: flex; align-items: center; gap: 14px">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: #c2410c; color: #ffffff; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">MK</span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 800">Mohammad Al Kholy</span>
        <span style="font-size: 13px; color: #475569">IT Manager · IT</span>
        <span style="font-size: 12px; color: #64748b">Employee ID <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700">1024</span></span>
      </span>
    </div>

    <h2 class="sec">Notifications</h2>
    <div class="grp">
      <label class="r"><span class="ic" style="background: #fff7ed; color: #9a3412"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></span><span style="flex: 1">Push notifications</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #c2410c"></label>
      <label class="r"><span class="ic" style="background: #eff6ff; color: #1d4ed8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg></span><span style="flex: 1">New tickets in my channels</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #c2410c"></label>
      <label class="r" style="border-bottom: none"><span class="ic" style="background: #f0fdf4; color: #15803d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span><span style="flex: 1">My Day reminders</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #c2410c"></label>
    </div>

    <h2 class="sec">Appearance</h2>
    <div class="grp" style="padding: 10px 14px">
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 3px; border-radius: 10px; background: #f1f5f9">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{t.sel}}" onClick="{{t.pick}}" style="height: 38px; border: none; border-radius: 8px; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <h2 class="sec">Account</h2>
    <div class="grp">
      <a href="MMail.dc.html" class="r" style="text-decoration: none; color: #0f172a"><span class="ic" style="background: #f1f5f9; color: #0f172a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span>Mail</span><span style="font-size: 12px; color: #15803d">Connected · synced 10 s ago</span></span></a>
      <div class="r" style="border-bottom: none"><span class="ic" style="background: #f1f5f9; color: #0f172a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></span><span style="flex: 1">Version</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #475569">280</span></div>
    </div>

    <div style="margin: 16px">
      <button onClick="{{ask}}" style="width: 100%; height: 48px; border-radius: 12px; border: 1px solid #fecaca; background: #fef2f2; color: #b91c1c; font-size: 15px; font-weight: 700; cursor: pointer">Sign out</button>
    </div>
  </div>
  <nav class="tb" aria-label="Main">
    <a href="MHome.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="MChannels.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg>Channels</a>
    <a href="MMyDay.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>My Day</a>
    <a href="MMail.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg>Mail</a>
    <a href="MMe.dc.html" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
  </nav>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-end">
      <div role="alertdialog" aria-modal="true" aria-labelledby="so-t" style="width: 100%; background: #ffffff; border-radius: 20px 20px 0 0; padding: 20px 20px 30px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="so-t" style="margin: 0; font-size: 18px; font-weight: 800">Sign out of Sila?</h2>
        <p style="margin: 0; font-size: 14px; color: #475569">You stop getting notifications on this phone until you sign in again.</p>
        <a href="MLogin.dc.html" style="height: 50px; border-radius: 12px; background: #b91c1c; color: #ffffff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Sign out</a>
        <button onClick="{{cancel}}" style="height: 46px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; color: #0f172a; font-size: 15px; font-weight: 700; cursor: pointer">Cancel</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'System', c: false }; }
  renderVals() {
    return {
      themes: ['Light', 'Dark', 'System'].map(l => { const on = l === this.state.t; return { label: l, sel: on ? 'true' : 'false', bg: on ? '#ffffff' : 'transparent', fg: on ? '#0f172a' : '#475569', shadow: on ? '0 1px 3px rgba(15,23,42,.12)' : 'none', pick: () => this.setState({ t: l }) }; }),
      confirm: this.state.c, ask: () => this.setState({ c: true }), cancel: () => this.setState({ c: false })
    };
  }
}
</script>
</body>
</html>
