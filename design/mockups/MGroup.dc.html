<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sila Mobile — Group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
.ib{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:#0f172a;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;text-decoration:none}
.row{display:flex;gap:8px;align-items:flex-end}
.av{width:30px;height:30px;border-radius:15px;color:#ffffff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.in{max-width:76%;padding:7px 12px;border-radius:14px 14px 14px 4px;background:#ffffff;border:1px solid #e2e8f0;font-size:14px}
.out{align-self:flex-end;max-width:76%;padding:7px 12px;border-radius:14px 14px 4px 14px;background:#fff7ed;border:1px solid #fed7aa;font-size:14px}
.who{display:block;font-size:12px;font-weight:800}
.meta{display:block;text-align:right;font-size:11px;color:#64748b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f1f5f9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0f172a; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px 6px 8px; display: flex; align-items: center; gap: 4px; background: #ffffff; border-bottom: 1px solid #e2e8f0">
    <a href="MHome.dc.html" class="ib" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
    <a href="MProfile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; min-height: 44px">
      <span style="position: relative; width: 42px; height: 42px; box-sizing: border-box; border-radius: 13px; background: {{badgeBg}}; border: 1.5px solid {{badgeBorder}}; color: {{badgeFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <sc-if value="{{isGroup}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
        <sc-if value="{{isBcast}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg></sc-if>
        <span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; border-radius: 9px; background: #c2410c; color: #ffffff; border: 2px solid #ffffff; font-size: 10px; font-weight: 800; line-height: 14px; text-align: center">{{tag}}</span>
      </span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">{{name}}</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #475569">
          <sc-if value="{{isGroup}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
          <sc-if value="{{isBcast}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg></sc-if>
          {{sub}}
        </span>
      </span>
    </a>
    <button class="ib" aria-label="Group info and members"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
  </header>

  <a href="MChat.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #fffbeb; border-bottom: 1px solid #fde68a; text-decoration: none; color: #0f172a; min-height: 44px; box-sizing: border-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21V4h11l-1 4h6v9h-8l1-4H4"></path></svg>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 11px; font-weight: 800; color: #92400e; text-transform: uppercase; letter-spacing: .04em">Pinned flag note</span>
      <span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pin}}</span>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
  </a>

  <div style="flex: 1; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="align-self: center; padding: 2px 10px; border-radius: 999px; background: #e2e8f0; color: #475569; font-size: 12px; font-weight: 700">Today</span>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <sc-if value="{{m.mine}}" hint-placeholder-val="{{false}}">
        <div class="out">{{m.text}}<span class="meta">{{m.time}} ✓✓</span></div>
      </sc-if>
      <sc-if value="{{m.other}}" hint-placeholder-val="{{true}}">
        <div class="row">
          <span class="av" style="background: {{m.color}}">{{m.initials}}</span>
          <div class="in"><span class="who" style="color: {{m.nameColor}}">{{m.who}}</span>{{m.text}}<span class="meta">{{m.time}}</span></div>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <sc-if value="{{canPost}}" hint-placeholder-val="{{true}}">
    <div style="padding: 8px 8px 24px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; align-items: flex-end; gap: 6px">
      <button class="ib" aria-label="Attach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <label style="flex: 1; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 22px; background: #f1f5f9">
        <input aria-label="Message" placeholder="{{placeholder}}" style="flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: #0f172a">
      </label>
      <button class="ib" aria-label="Record voice note" style="background: #c2410c; color: #ffffff; border-radius: 22px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{readOnly}}" hint-placeholder-val="{{false}}">
    <div style="padding: 14px 16px 30px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #475569">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8"></path></svg>
      Only admins can post in this broadcast
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"broadcast":{"editor":"boolean","default":false},"isAdmin":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const b = this.props.broadcast ?? false;
    const admin = this.props.isAdmin ?? false;
    const G = [
      { who: 'Ahmed Samy', initials: 'AS', color: '#0f766e', nameColor: '#0f766e', text: 'Price list for drums is attached in the channel.', time: '09:31' },
      { who: 'Khaled Nabil', initials: 'KN', color: '#b45309', nameColor: '#92400e', text: 'Who approves the Delta order this week?', time: '09:40' },
      { mine: true, text: 'I will, send it to me before 2 pm.', time: '09:42' },
      { who: 'Mona Hassan', initials: 'MH', color: '#7c3aed', nameColor: '#6d28d9', text: 'Done, ticket #2301855 is in progress.', time: '11:40' }
    ];
    const B = [
      { who: 'HR', initials: 'HR', color: '#c2410c', nameColor: '#9a3412', text: 'Hi to all. The office closes at 2 pm on Thursday.', time: '10:15' },
      { who: 'IT', initials: 'IT', color: '#2563eb', nameColor: '#1d4ed8', text: 'Mail will be down for 30 minutes on Friday at 8 am.', time: '10:20' }
    ];
    return {
      name: b ? 'GLC Public' : 'Purchasing team', isGroup: !b, isBcast: b, tag: b ? 'B' : 'G',
      badgeBg: b ? '#fff7ed' : '#f8fafc', badgeBorder: b ? '#fdba74' : '#e2e8f0', badgeFg: b ? '#9a3412' : '#475569',
      sub: b ? 'Broadcast · all active users' : '12 members · Mona, Ahmed, Khaled…',
      pin: b ? 'Office hours during Ramadan: 9 am – 3 pm' : 'Send drum quotations before Thursday',
      msgs: (b ? B : G).map(m => ({ ...m, mine: !!m.mine, other: !m.mine })),
      canPost: !b || admin, readOnly: b && !admin,
      placeholder: b ? 'Post to all users' : 'Message'
    };
  }
}
</script>
</body>
</html>
